services:
  - type: web
    name: tra-assistant-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app_bridge.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: TDX_CLIENT_ID
        sync: false
      - key: TDX_CLIENT_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
