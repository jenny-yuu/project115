name: Fetch Train Delay and Weather Data

on:
  schedule:
    # 這裡的 Cron 語法代表每 5 分鐘自動執行一次 (這是 GitHub Actions 允許的最快排程)
    - cron: '*/5 * * * *'
  # 允許我們可以在 GitHub 網頁上手動點擊執行
  workflow_dispatch:

jobs:
  update-firebase:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: 📥 取得程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 快取套件加速執行

      - name: 📦 安裝所需套件
        run: |
          pip install -r requirements.txt

      - name: 🚂 執行更新台鐵即時誤點狀態
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_KEY }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python update_live_delay_to_firebase.py
          
      - name: ⛅ 執行更新氣象署即時天氣 (含地震預警)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_KEY }}
          CWA_KEY: ${{ secrets.CWA_KEY }}
        run: python update_weather_to_firebase.py
